name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m py_compile $(git ls-files '*.py')

      - name: JSON validity
        run: |
          for f in $(git ls-files '*.json'); do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "::error file=$f::Invalid JSON"; exit 1; }
          done

      - name: Engine tests (node --test)
        # The layout engine is plain JS with no dependencies; ubuntu-latest ships Node.
        run: node --test tests/*.test.mjs

      - name: CLI tests (pytest)
        # PDF tests run because ubuntu-latest ships Chrome.
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans every commit

      - name: gitleaks (secrets in history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact -v
